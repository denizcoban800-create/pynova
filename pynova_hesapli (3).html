const defaultState={profile:{goal:"curiosity",age:"16-20",experience:"new",minutes:10,name:"",email:""},language:"en",done:[],xp:0,streak:1,attempts:{},quizCorrect:{},minutesDone:0,activeLesson:0,view:"home",code:'isim = "Ada"\\nprint("Merhaba", isim)\\nprint(2 + 3)'};

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function progress(){return Math.round(state.done.length/lessons.length*100)}
function toast(msg){let old=document.querySelector(".toast");if(old)old.remove();let el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2700)}
function confetti(){let c=document.createElement("div");c.className="confetti";for(let i=0;i<65;i++){let x=document.createElement("i");x.style.left=Math.random()*100+"%";x.style.background=["#9c7bff","#6ce7f5","#c8f878","#ff78c8","#ffd36c"][i%5];x.style.animationDelay=Math.random()*.45+"s";x.style.transform=`rotate(${Math.random()*360}deg)`;c.append(x)}document.body.append(c);setTimeout(()=>c.remove(),2300)}

function progressView(){let attempts=Object.values(state.attempts).reduce((a,b)=>a+b,0);return `<section class="view">${header("KÜÇÜK ADIMLAR BİRİKİR","İlerlemen, kendi hikâyen.")}<div class="stats"><div class="stat"><div class="statlabel">Ders tamamlandı</div><div class="statnum">${state.done.length}/${lessons.length}</div><div class="progress"><span style="width:${progress()}%"></span></div></div><div class="stat"><div class="statlabel">Toplam XP</div><div class="statnum">${state.xp}</div><div class="statfoot">Denemelerden kazanılır</div></div><div class="stat"><div class="statlabel">Soru denemesi</div><div class="statnum">${attempts}</div><div class="statfoot">Her deneme pratik</div></div><div class="stat"><div class="statlabel">Günlük hedef</div><div class="statnum">${state.profile.minutes} dk</div><div class="statfoot">Kişisel hedefin</div></div></div><div class="panel"><div class="sectionhead" style="margin-top:0"><div><h3>Başarı haritan</h3><p>İlerleme cihazındaki tarayıcıda saklanır.</p></div></div>${lessons.map(l=>`<div style="display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff0d"><div class="lessonnum">${state.done.includes(l.id)?'✓':l.id+1}</div><div><strong style="font-size:13px">${l.title}</strong><div style="font-size:11px;color:var(--muted);margin-top:4px">${state.quizCorrect[l.id]?'Soru doğru cevaplandı':(state.attempts[l.id]||0)+' deneme'}</div></div><span style="font-size:11px;color:${state.done.includes(l.id)?'var(--good)':'var(--muted)'}">${state.done.includes(l.id)?'Tamamlandı':'Bekliyor'}</span></div>`).join('')}</div><div class="sectionhead"><div><h3>Günlük hedefin</h3><p>Burada süreyi sen kaydedersin; otomatik takip yapılmaz.</p></div></div><div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div style="font-size:13px;color:var(--muted)">Bugün kaydettiğin çalışma</div><div class="statnum">${state.minutesDone} <span style="font-size:14px;color:var(--muted)">dakika</span></div></div><button class="btn primary" onclick="logMinutes()">＋ Çalışma süresi ekle</button></div><div class="progress"><span style="width:${Math.min(100,state.minutesDone/Math.max(1,state.profile.minutes)*100)}%"></span></div></div></section>`}
function settings(){return `<section class="view">${header("KİŞİSELLEŞTİR","Öğrenme düzenin.")}<div class="panel"><h3 style="font:700 20px 'Space Grotesk';margin-top:0">Profilin</h3><div class="settingsgrid"><div class="field"><label>Kullanıcı adı</label><input id="setName" maxlength="24" value="${esc(state.profile.name)}"></div><div class="field"><label>E-posta adresi</label><input id="setEmail" type="email" maxlength="120" value="${esc(state.profile.email||'')}" placeholder="ornek@mail.com"></div><div class="field"><label>Günlük hedef (dakika)</label><div class="minutesrow">${[5,10,20,30,45].map(n=>`<button class="minuteopt ${state.profile.minutes===n?'selected':''}" onclick="chooseMinutes(${n})">${n} dk</button>`).join('')}</div></div></div><button class="btn primary" onclick="saveSettings()">Değişiklikleri kaydet</button></div><div class="panel" style="margin-top:15px"><h3 style="font:700 18px 'Space Grotesk';margin-top:0">Verilerin</h3><p style="font-size:13px;color:var(--muted);line-height:1.7">İlerleme bu tarayıcının yerel depolamasında tutulur. Sayfa çevrimdışıyken de temel özellikler çalışır; yazı tipleri internet bağlantısına bağlı olabilir.</p><button class="btn secondary" onclick="exportProgress()">İlerlememi dışa aktar ↗</button> <button class="btn secondary" onclick="resetProgress()">İlerlemeyi sıfırla</button></div></section>`}
function onboarding(){return `<div class="onboarding"><div class="onboardleft"><div class="brand"><div class="brandmark">Py</div><div><div class="brandname">Py<span>Nova</span></div><div class="tiny">LEARN BY BUILDING</div></div></div><div class="eyebrow">TURN CURIOSITY INTO CODE</div><h1>Code your<br><span>future.</span></h1><p>You don't need to be a genius to learn Python. A little curiosity, small steps, and practice are enough.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:24px"><span class="pill">✦ Short lessons</span><span class="pill">⌘ Code lab</span><span class="pill">↻ Retry anytime</span></div></div><div class="onboardvisual"><div class="orbit2"></div><div class="bigorb">Py</div></div><div class="onboardform"><div class="forminner"><div style="display:flex;justify-content:flex-end;margin-bottom:18px"><label style="color:var(--muted);font-size:12px">🌐 Language <select onchange="changeLanguage(this.value)" style="margin-left:7px;padding:8px;border-radius:10px;background:#15172a;color:white;border:1px solid #ffffff20"><option value="en" ${state.language==='en'?'selected':''}>English</option><option value="tr">Türkçe</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ru">Русский</option><option value="ar">العربية</option><option value="hi">हिन्दी</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fi">Suomi</option></select></label></div><div class="eyebrow">YOUR PERSONAL LEARNING PATH</div><div class="stepdots"><span class="on" id="dot0"></span><span id="dot1"></span><span id="dot2"></span><span id="dot3"></span><span id="dot4"></span></div><div id="stepContent"></div></div></div></div>`}
let onboardStep=0, minutesPick=10;
const I18N={
en:{email:"Enter your email",emailDesc:"Start by adding a valid email address.",emailLabel:"Email address",username:"Choose a username",usernameDesc:"This is how you’ll appear in PyNova.",usernameLabel:"Username",continue:"Continue →",back:"← Back",wrongEmail:"Wrong email. Please enter a valid email address.",wrongName:"Please enter a username with at least 2 characters.",goal:"What do you want to learn coding for?",goalDesc:"We’ll use this to suggest a starting path.",game:"Make games",web:"Build websites",ai:"Explore AI",career:"Future career",school:"School & projects",curious:"Just curious",level:"Let’s set your starting level.",age:"Age range (optional)",experience:"Coding experience",beginner:"I’m a beginner",some:"I’ve tried a little",time:"How much time can you spend daily?",timeDesc:"Small, regular practice adds up.",start:"🚀 Start learning",minutes:"minutes / day"},
tr:{email:"E-posta adresini gir",emailDesc:"Başlamak için geçerli bir e-posta adresi yaz.",emailLabel:"E-posta adresi",username:"Bir kullanıcı adı seç",usernameDesc:"PyNova’da bu adla görüneceksin.",usernameLabel:"Kullanıcı adı",continue:"Devam et →",back:"← Geri",wrongEmail:"Hatalı e-posta. Lütfen geçerli bir e-posta adresi gir.",wrongName:"En az 2 karakterlik bir kullanıcı adı gir.",goal:"Kodlamayı ne için öğrenmek istiyorsun?",goalDesc:"Sana uygun bir başlangıç yolu önereceğiz.",game:"Oyun yapmak",web:"Web sitesi yapmak",ai:"Yapay zekâyı keşfet",career:"Gelecek kariyerim",school:"Okul ve projeler",curious:"Sadece merak ediyorum",level:"Başlangıç seviyeni seçelim.",age:"Yaş aralığı (isteğe bağlı)",experience:"Kodlama deneyimi",beginner:"Yeni başlıyorum",some:"Biraz denedim",time:"Her gün ne kadar zaman ayırabilirsin?",timeDesc:"Küçük ve düzenli pratik işe yarar.",start:"🚀 Öğrenmeye başla",minutes:"dakika / gün"},
es:{email:"Introduce tu correo",emailDesc:"Empieza con un correo válido.",emailLabel:"Correo electrónico",username:"Elige un nombre de usuario",usernameDesc:"Así aparecerás en PyNova.",usernameLabel:"Nombre de usuario",continue:"Continuar →",back:"← Atrás",wrongEmail:"Correo incorrecto. Introduce una dirección válida.",wrongName:"Introduce al menos 2 caracteres.",goal:"¿Para qué quieres aprender a programar?",goalDesc:"Te sugeriremos una ruta inicial.",game:"Crear juegos",web:"Crear sitios web",ai:"Explorar IA",career:"Carrera futura",school:"Escuela y proyectos",curious:"Solo curiosidad",level:"Elige tu nivel inicial.",age:"Edad (opcional)",experience:"Experiencia programando",beginner:"Soy principiante",some:"He probado un poco",time:"¿Cuánto tiempo tienes cada día?",timeDesc:"La práctica regular suma.",start:"🚀 Empezar",minutes:"minutos / día"},
fr:{email:"Saisissez votre e-mail",emailDesc:"Commencez avec une adresse valide.",emailLabel:"Adresse e-mail",username:"Choisissez un nom d’utilisateur",usernameDesc:"C’est ainsi que vous apparaîtrez sur PyNova.",usernameLabel:"Nom d’utilisateur",continue:"Continuer →",back:"← Retour",wrongEmail:"E-mail incorrect. Saisissez une adresse valide.",wrongName:"Saisissez au moins 2 caractères.",goal:"Pourquoi apprendre à coder ?",goalDesc:"Nous suggérerons un parcours de départ.",game:"Créer des jeux",web:"Créer des sites web",ai:"Explorer l’IA",career:"Carrière future",school:"École et projets",curious:"Par curiosité",level:"Choisissez votre niveau.",age:"Âge (facultatif)",experience:"Expérience en programmation",beginner:"Je débute",some:"J’ai un peu essayé",time:"Combien de temps par jour ?",timeDesc:"La pratique régulière compte.",start:"🚀 Commencer",minutes:"minutes / jour"},
de:{email:"E-Mail-Adresse eingeben",emailDesc:"Beginne mit einer gültigen E-Mail-Adresse.",emailLabel:"E-Mail-Adresse",username:"Benutzernamen wählen",usernameDesc:"So wirst du auf PyNova angezeigt.",usernameLabel:"Benutzername",continue:"Weiter →",back:"← Zurück",wrongEmail:"Ungültige E-Mail. Bitte gib eine gültige Adresse ein.",wrongName:"Bitte mindestens 2 Zeichen eingeben.",goal:"Warum möchtest du programmieren lernen?",goalDesc:"Wir schlagen dir einen Lernpfad vor.",game:"Spiele entwickeln",web:"Websites erstellen",ai:"KI entdecken",career:"Zukünftiger Beruf",school:"Schule und Projekte",curious:"Einfach neugierig",level:"Wähle dein Einstiegsniveau.",age:"Alter (optional)",experience:"Programmiererfahrung",beginner:"Ich bin Anfänger",some:"Etwas ausprobiert",time:"Wie viel Zeit hast du täglich?",timeDesc:"Regelmäßiges Üben hilft.",start:"🚀 Loslegen",minutes:"Minuten / Tag"},
};
const LANG_LABEL={en:"English",tr:"Türkçe",es:"Español",fr:"Français",de:"Deutsch",it:"Italiano",pt:"Português",ru:"Русский",ar:"العربية",hi:"हिन्दी",zh:"中文",ja:"日本語",ko:"한국어",fi:"Suomi"};
function tx(k){return (I18N[state.language]&&I18N[state.language][k])||I18N.en[k]||k}
function renderOnboardStep(){let el=document.getElementById("stepContent");if(!el)return;document.querySelectorAll(".stepdots span").forEach((x,i)=>x.classList.toggle("on",i<=onboardStep));if(onboardStep===0){el.innerHTML=`<h2>${tx('email')}</h2><p>${tx('emailDesc')}</p><div class="field"><label>${tx('emailLabel')}</label><input id="onboardEmail" type="email" maxlength="120" autocomplete="email" placeholder="you@example.com" value="${esc(state.profile.email||'')}"></div><div id="emailError" style="color:var(--bad);font-size:12px;min-height:18px;margin-top:5px"></div><div class="onboardnav"><span></span><button class="btn primary" onclick="validateEmailStep()">${tx('continue')}</button></div>`}else if(onboardStep===1){el.innerHTML=`<h2>${tx('username')}</h2><p>${tx('usernameDesc')}</p><div class="field"><label>${tx('usernameLabel')}</label><input id="onboardName" maxlength="24" autocomplete="nickname" placeholder="e.g. CodeExplorer" value="${esc(state.profile.name||'')}"></div><div id="nameError" style="color:var(--bad);font-size:12px;min-height:18px;margin-top:5px"></div><div class="onboardnav"><button class="btn secondary" onclick="onboardBack()">${tx('back')}</button><button class="btn primary" onclick="validateNameStep()">${tx('continue')}</button></div>`}else if(onboardStep===2){el.innerHTML=`<h2>${tx('goal')}</h2><p>${tx('goalDesc')}</p><div class="choicegrid">${[['game','🎮'],['web','🌐'],['ai','🤖'],['career','🚀'],['school','📚'],['curious','✨']].map(([k,i])=>`<button class="choice ${state.profile.goal===k?'selected':''}" onclick="pick('goal','${k==='curious'?'curiosity':k}')"><span>${i}</span><strong>${tx(k)}</strong></button>`).join('')}</div><div class="onboardnav"><button class="btn secondary" onclick="onboardBack()">${tx('back')}</button><button class="btn primary" onclick="onboardNext()">${tx('continue')}</button></div>`}else if(onboardStep===3){el.innerHTML=`<h2>${tx('level')}</h2><div class="field"><label>${tx('age')}</label><div class="choicegrid">${[['under13','Under 13'],['13-15','13–15'],['16-20','16–20'],['21+','21+']].map(([v,t])=>`<button class="choice ${state.profile.age===v?'selected':''}" onclick="pick('age','${v}')"><strong>${t}</strong></button>`).join('')}</div></div><div class="field"><label>${tx('experience')}</label><div class="choicegrid">${[['new','beginner'],['some','some']].map(([v,k])=>`<button class="choice ${state.profile.experience===v?'selected':''}" onclick="pick('experience','${v}')"><strong>${tx(k)}</strong></button>`).join('')}</div></div><div class="onboardnav"><button class="btn secondary" onclick="onboardBack()">${tx('back')}</button><button class="btn primary" onclick="onboardNext()">${tx('continue')}</button></div>`}else{el.innerHTML=`<h2>${tx('time')}</h2><p>${tx('timeDesc')}</p><div class="choicegrid">${[5,10,20,30].map(n=>`<button class="choice ${state.profile.minutes===n?'selected':''}" onclick="pick('minutes',${n})"><span>⏱️</span><strong>${n} ${tx('minutes')}</strong></button>`).join('')}</div><div class="onboardnav"><button class="btn secondary" onclick="onboardBack()">${tx('back')}</button><button class="btn primary" onclick="finishOnboard()">${tx('start')}</button></div>`}}
function validateEmailStep(){let e=document.getElementById('onboardEmail'),err=document.getElementById('emailError');if(!e||! /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e.value.trim())){err.textContent=tx('wrongEmail');e?.focus();return}state.profile.email=e.value.trim();save();onboardStep=1;renderOnboardStep()}
function validateNameStep(){let n=document.getElementById('onboardName'),err=document.getElementById('nameError');if(!n||n.value.trim().length<2){err.textContent=tx('wrongName');n?.focus();return}state.profile.name=n.value.trim();save();onboardStep=2;renderOnboardStep()}
function changeLanguage(lang){state.language=lang;document.documentElement.lang=lang;save();render();if(!state.onboarded)renderOnboardStep();}
function pick(k,v){state.profile[k]=v;save();renderOnboardStep()}
function onboardNext(){onboardStep=Math.min(4,onboardStep+1);renderOnboardStep()}function onboardBack(){onboardStep=Math.max(0,onboardStep-1);renderOnboardStep()}
function finishOnboard(){if(!state.profile.email){onboardStep=0;renderOnboardStep();return}if(!state.profile.name){onboardStep=1;renderOnboardStep();return}state.onboarded=true;save();render()}
function go(v){state.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function openLesson(id){state.activeLesson=id;state.view='lesson';save();render();window.scrollTo({top:0,behavior:'smooth'})}
function answer(id,i){if(state.quizCorrect[id])return;state.attempts[id]=(state.attempts[id]||0)+1;let l=lessons[id];if(i===l.correct){state.quizCorrect[id]=true;state.xp+=20;if(!state.done.includes(id)){state.done.push(id);state.xp+=10}save();render();confetti();toast("Doğru cevap! +20 XP kazandın 🎉")}else{save();render();toast("Sorun değil — ipucunu oku ve tekrar dene. 💫")}}
function resetQuestion(id){delete state.quizCorrect[id];save();render()}
function nextLesson(id){if(id<lessons.length-1)openLesson(id+1);else{go('progress');confetti();toast("Temel Python kursunu tamamladın! 🎉")}}
function copyCode(id){let s=lessons[id].code;navigator.clipboard?.writeText(s).then(()=>toast("Kod kopyalandı!")).catch(()=>toast("Kopyalama bu tarayıcıda desteklenmiyor."))}
function miniEval(code){let vars={};let out=[];let lines=code.split(/\r?\n/);for(let raw of lines){let line=raw.trim();if(!line||line.startsWith('#'))continue;if(line.startsWith('print(')&&line.endsWith(')')){let expr=line.slice(6,-1);let args=expr.split(',').map(s=>s.trim());let vals=args.map(a=>evalExpr(a,vars));out.push(vals.map(v=>v===undefined?'None':String(v)).join(' '));continue}let m=line.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);if(m){vars[m[1]]=evalExpr(m[2],vars);continue}throw new Error('Bu mini simülatör bu satırı henüz desteklemiyor: '+line)}return out.join('\n')}
function evalExpr(expr,vars){expr=expr.trim();if((expr.startsWith('"')&&expr.endsWith('"'))||(expr.startsWith("'")&&expr.endsWith("'")))return expr.slice(1,-1);if(Object.prototype.hasOwnProperty.call(vars,expr))return vars[expr];if(/^[+-]?\d+(?:\.\d+)?$/.test(expr))return Number(expr);if(/^[\d\s()+\-*/%.]+$/.test(expr)){if(!/^[\d\s()+\-*/%.]+$/.test(expr))throw new Error('İşlem desteklenmiyor');if(/\/\s*0(?:\D|$)/.test(expr))throw new Error('Sıfıra bölme yapılamaz');return Function('"use strict"; return ('+expr+')')()}throw new Error('Desteklenmeyen ifade: '+expr)}
function runCode(){let el=document.getElementById('codeEditor'),out=document.getElementById('output');if(!el||!out)return;state.code=el.value.replace(/\n/g,'\\n');save();out.classList.remove('empty');try{let result=miniEval(el.value);out.textContent=result||'(Çıktı yok)';out.style.color='var(--lime)';toast("Kod çalıştırıldı ✦")}catch(e){out.textContent='Hata: '+e.message+'\n\nİpucu: print("Merhaba") veya sayi = 2 + 3 gibi basit satırlarla dene.';out.style.color='var(--bad)'}}
function resetCode(){let el=document.getElementById('codeEditor'),out=document.getElementById('output');if(el)el.value='';if(out){out.textContent='Editör temizlendi. Kod yazıp çalıştırabilirsin.';out.classList.add('empty')}state.code='';save()}
function insertSample(){setCode(0)}
function setCode(i){let samples=['print("Merhaba!")','print(18 * 7)','isim = "Ada"\nprint("Ben", isim)'];let el=document.getElementById('codeEditor');if(el)el.value=samples[i];state.code=samples[i].replace(/\n/g,'\\n');save();toast("Örnek kod yüklendi")}
function loadExample(id){let el=document.getElementById('codeEditor');if(el)el.value=lessons[id].code;state.code=lessons[id].code.replace(/\n/g,'\\n');save()}
function chooseMinutes(n){state.profile.minutes=n;save();render()}
function saveSettings(){let n=document.getElementById('setName'),e=document.getElementById('setEmail');if(n&&n.value.trim())state.profile.name=n.value.trim();if(e&&!e.checkValidity()){toast("E-posta adresini kontrol et.");e.focus();return}if(e)state.profile.email=e.value.trim();save();render();toast("Profilin güncellendi")}
function logMinutes(){let v=prompt("Bugün kaç dakika çalıştın?");if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<1||n>1440){toast("Lütfen 1–1440 arasında dakika gir.");return}state.minutesDone+=Math.floor(n);save();render();toast("Çalışma süren kaydedildi ✦")}
function exportProgress(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pynova-ilerlemem.json';a.click();URL.revokeObjectURL(a.href);toast("İlerleme dosyan hazır")}
function resetProgress(){if(!confirm("Tüm ilerleme ve XP sıfırlansın mı? Bu işlem geri alınamaz."))return;localStorage.removeItem("pynova-v3");state={...defaultState,profile:{...defaultState.profile},done:[],attempts:{},quizCorrect:{}};save();render();toast("İlerleme sıfırlandı")}
function render(){let root=document.getElementById('root');if(!state.onboarded){root.innerHTML=onboarding();renderOnboardStep();return}let content=state.view==='home'?home():state.view==='learn'?learn():state.view==='lesson'?lessonView():state.view==='path'?path():state.view==='play'?play():state.view==='progress'?progressView():settings();root.innerHTML=`<div class="app">${nav()}<main class="main">${content}</main></div>`}
render();
</script>
